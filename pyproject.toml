[project]
name = "fastapi-code-generator"
version = "0.5.4"
description = ""
authors = [{name = "Koudai Aono", email = "koxudaxi@gmail.com"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<4"
dependencies = [
    "typer",
    "datamodel-code-generator[http]",
    "stringcase",
    "PySnooper",
    "jinja2",
    "pydantic>=2",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Natural Language :: English",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython"
]

[project.urls]
Homepage = "https://github.com/koxudaxi/fastapi-code-generator"
Repository = "https://github.com/koxudaxi/fastapi-code-generator"

[project.scripts]
fastapi-codegen = "fastapi_code_generator.__main__:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "mypy",
    "freezegun",
    "pre-commit>=4.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fastapi_code_generator"]
